<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="vinylGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebc19c" />
      <stop offset="100%" stop-color="#b8895f" />
    </linearGradient>

    <radialGradient id="highlight" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <clipPath id="centerClip">
      <circle cx="150" cy="150" r="45" />
    </clipPath>
  </defs>

  <circle cx="150" cy="150" r="100" fill="url(#vinylGradient)" stroke="#555" stroke-width="0.5" />

  <circle cx="150" cy="150" r="90" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />
  <circle cx="150" cy="150" r="80" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />
  <circle cx="150" cy="150" r="70" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />
  <circle cx="150" cy="150" r="60" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />
  <circle cx="150" cy="150" r="55" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />

  <!-- Album Art Center (enlarged for readable text) -->
  <image href="data:image/jpeg;base64,"
         x="105" y="105" width="90" height="90"
         clip-path="url(#centerClip)" preserveAspectRatio="xMidYMid slice" />

  <!-- Subtle border around the label to separate it from the vinyl -->
  <circle cx="150" cy="150" r="45" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.8" />

  <circle cx="150" cy="150" r="5" fill="#000" />
  <circle cx="150" cy="150" r="100" fill="url(#highlight)" pointer-events="none" />
</svg>